services:
  backend:
    build:
      context: ./backend
    container_name: ai-recruiter-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: ai-recruiter-worker
    command: >
      sh -c "alembic upgrade head && python worker.py"
    env_file:
      - ./backend/.env
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/recruiter-ui
      args:
        - REACT_APP_API_URL=
    container_name: ai-recruiter-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
