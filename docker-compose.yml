services:
  backend:
    build:
      context: ./backend
    container_name: ai-recruiter-backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/recruiter-ui
      args:
        - REACT_APP_API_URL=/api
    container_name: ai-recruiter-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
