services:
  backend:
    build:
      context: ./backend
    container_name: ai-recruiter-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: ai-recruiter-worker
    command: python worker.py
    env_file:
      - ./backend/.env
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/recruiter-ui
      args:
        - REACT_APP_API_URL=/api
    container_name: ai-recruiter-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
