services:
  - type: web
    name: ai-recruiter-backend
    runtime: python
    repo: https://github.com/YOUR_USER/YOUR_REPO
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_CONNECTION_STRING
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
    healthCheckPath: /health

  - type: worker
    name: ai-recruiter-worker
    runtime: python
    repo: https://github.com/YOUR_USER/YOUR_REPO
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_CONNECTION_STRING
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
