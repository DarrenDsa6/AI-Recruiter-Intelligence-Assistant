global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ai-recruiter-backend"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-recruiter-backend:8000"]
    authorization:
      credentials: ${METRICS_API_KEY}
      type: Bearer
